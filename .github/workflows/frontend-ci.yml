name: Frontend CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # npm 캐시 추가
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # npm ci 재시도 적용
      - name: Install dependencies
        run: |
          for i in 1 2; do
            npm ci && break
            echo "npm ci failed, retrying in 10s..."
            sleep 10
          done

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # 코드 스타일, 문법, 잠재적 오류 등을 자동으로 검사
      # npm install eslint --save-dev
      # npx eslint --init
      - name: Lint
        run: npm run lint